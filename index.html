<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Routes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Club Routes</h1>
      <p id="summary">Loading…</p>
    </header>

    <div class="controls">
      <input id="search" type="search" placeholder="Search routes">
      <div class="row">
        <select id="sort">
          <option value="name">Name</option>
          <option value="km">Distance</option>
          <option value="gain">Climbing</option>
        </select>
        <select id="colour-mode" title="Line colours">
          <option value="overlap">Overlap view</option>
          <option value="distinct">Distinct colours</option>
        </select>
      </div>
      <div class="row">
        <button id="all-on">Show all</button>
        <button id="all-off">Hide all</button>
        <button id="fit">Fit visible</button>
      </div>
    </div>

    <ul id="list"></ul>
  </aside>

  <main id="map"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
